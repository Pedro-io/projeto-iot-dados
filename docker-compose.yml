

# =============================================================================
# Stack E1 do Projeto IoT Lakehouse
# Serviços: Zookeeper, Kafka, Schema Registry, Kafka UI, MinIO
#
# Uso:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f kafka
#   docker compose down -v
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Zookeeper — coordenação do cluster Kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Logs estruturados JSON
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: "INFO"
      ZOOKEEPER_LOG4J_LOGGERS: "org.apache.zookeeper=INFO"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | timeout 2 bash -c 'cat < /dev/null > /dev/tcp/localhost/2181'"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  # ---------------------------------------------------------------------------
  # Kafka Broker
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Logs estruturados JSON
      KAFKA_LOG4J_ROOT_LOGLEVEL: "INFO"
      KAFKA_LOG4J_LOGGERS: "kafka=INFO,kafka.controller=INFO,kafka.log.LogCleaner=INFO,state.change.logger=INFO,kafka.producer.async.DefaultEventHandler=INFO"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 30s
      retries: 20
      start_period: 120s
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---------------------------------------------------------------------------
  # Schema Registry — validação e versionamento de schemas Avro/JSON
  # API REST: http://localhost:8081
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.3
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL: http
      # Logs estruturados
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: "INFO"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Schema Registry Init — registra o schema JSON do sensor na inicialização
  # ---------------------------------------------------------------------------
  schema-registry-init:
    image: curlimages/curl:latest
    container_name: schema-registry-init
    depends_on:
      schema-registry:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'Registrando schema iot-sensors-raw...';
        curl -s -X POST http://schema-registry:8081/subjects/iot-sensors-raw-value/versions \
          -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
          -d '{
            \"schemaType\": \"JSON\",
            \"schema\": \"{\\\"type\\\": \\\"object\\\", \\\"title\\\": \\\"SensorEvent\\\", \\\"required\\\": [\\\"event_id\\\", \\\"sensor_id\\\", \\\"equipment_id\\\", \\\"factory_id\\\", \\\"measurement_type\\\", \\\"value\\\", \\\"unit\\\", \\\"timestamp\\\", \\\"quality\\\", \\\"is_anomaly\\\", \\\"metadata\\\"], \\\"properties\\\": {\\\"event_id\\\": {\\\"type\\\": \\\"string\\\"}, \\\"sensor_id\\\": {\\\"type\\\": \\\"string\\\"}, \\\"equipment_id\\\": {\\\"type\\\": \\\"string\\\"}, \\\"factory_id\\\": {\\\"type\\\": \\\"string\\\"}, \\\"measurement_type\\\": {\\\"type\\\": \\\"string\\\", \\\"enum\\\": [\\\"temperature\\\", \\\"humidity\\\", \\\"pressure\\\", \\\"vibration\\\", \\\"current\\\"]}, \\\"value\\\": {\\\"type\\\": \\\"number\\\"}, \\\"unit\\\": {\\\"type\\\": \\\"string\\\"}, \\\"timestamp\\\": {\\\"type\\\": \\\"string\\\", \\\"format\\\": \\\"date-time\\\"}, \\\"quality\\\": {\\\"type\\\": \\\"string\\\", \\\"enum\\\": [\\\"good\\\", \\\"warning\\\", \\\"bad\\\"]}, \\\"is_anomaly\\\": {\\\"type\\\": \\\"boolean\\\"}, \\\"metadata\\\": {\\\"type\\\": \\\"object\\\"}}}\"
          }';
        echo '';
        echo 'Schema registrado com sucesso.';
        exit 0;
      "

  # ---------------------------------------------------------------------------
  # Kafka UI — interface web para tópicos, mensagens e schemas
  # Acesse: http://localhost:8080
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: iot-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      # Integração com Schema Registry no Kafka UI
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  # ---------------------------------------------------------------------------
  # MinIO — object storage S3-compatível (Bronze / Silver / Gold)
  # Console: http://localhost:9001  |  API S3: http://localhost:9000
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

  # ---------------------------------------------------------------------------
  # MinIO Init — cria os buckets bronze, silver e gold automaticamente
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/bronze;
        mc mb --ignore-existing local/silver;
        mc mb --ignore-existing local/gold;
        echo 'Buckets criados: bronze, silver, gold';
        exit 0;
      "

# =============================================================================
# Volumes persistentes
# =============================================================================
volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  minio_data: