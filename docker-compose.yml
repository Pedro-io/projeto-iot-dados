
# =============================================================================
# Stack E1 — Streaming (Kafka + Schema Registry)
#
# Pré-requisitos:
#   1. Infra de storage já rodando: cd infra/docker && docker compose up -d
#   2. Buckets MinIO provisionados:  cd infra/terraform && terraform apply
#
# Uso:
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f kafka
#   docker compose down -v
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Kafka Broker + Controller (KRaft — sem Zookeeper)
  #
  # CLUSTER_ID: UUID fixo base64url necessário para o KRaft formatar o storage.
  # Para gerar um novo:
  #   docker run --rm confluentinc/cp-kafka:7.5.3 kafka-storage random-uuid
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG4J_ROOT_LOGLEVEL: "INFO"
      KAFKA_LOG4J_LOGGERS: "kafka=INFO,kafka.controller=INFO,kafka.log.LogCleaner=INFO,state.change.logger=INFO,kafka.producer.async.DefaultEventHandler=INFO"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---------------------------------------------------------------------------
  # Schema Registry — validação e versionamento de schemas Avro/JSON
  # API REST: http://localhost:8081
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.3
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_SCHEMA_REGISTRY_INTER_INSTANCE_PROTOCOL: http
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: "INFO"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Schema Registry Init — registra o schema JSON do sensor na inicialização
  # ---------------------------------------------------------------------------
  schema-registry-init:
    image: curlimages/curl:latest
    container_name: schema-registry-init
    depends_on:
      schema-registry:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'Registrando schema iot-sensors-raw...';
        curl -s -X POST http://schema-registry:8081/subjects/iot-sensors-raw-value/versions \
          -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
          -d '{
            \"schemaType\": \"JSON\",
            \"schema\": \"{\\\"type\\\": \\\"object\\\", \\\"title\\\": \\\"SensorEvent\\\", \\\"required\\\": [\\\"event_id\\\", \\\"sensor_id\\\", \\\"equipment_id\\\", \\\"factory_id\\\", \\\"measurement_type\\\", \\\"value\\\", \\\"unit\\\", \\\"timestamp\\\", \\\"quality\\\", \\\"is_anomaly\\\", \\\"metadata\\\"], \\\"properties\\\": {\\\"event_id\\\": {\\\"type\\\": \\\"string\\\"}, \\\"sensor_id\\\": {\\\"type\\\": \\\"string\\\"}, \\\"equipment_id\\\": {\\\"type\\\": \\\"string\\\"}, \\\"factory_id\\\": {\\\"type\\\": \\\"string\\\"}, \\\"measurement_type\\\": {\\\"type\\\": \\\"string\\\", \\\"enum\\\": [\\\"temperature\\\", \\\"humidity\\\", \\\"pressure\\\", \\\"vibration\\\", \\\"current\\\"]}, \\\"value\\\": {\\\"type\\\": \\\"number\\\"}, \\\"unit\\\": {\\\"type\\\": \\\"string\\\"}, \\\"timestamp\\\": {\\\"type\\\": \\\"string\\\", \\\"format\\\": \\\"date-time\\\"}, \\\"quality\\\": {\\\"type\\\": \\\"string\\\", \\\"enum\\\": [\\\"good\\\", \\\"warning\\\", \\\"bad\\\"]}, \\\"is_anomaly\\\": {\\\"type\\\": \\\"boolean\\\"}, \\\"metadata\\\": {\\\"type\\\": \\\"object\\\"}}}\"
          }';
        echo '';
        echo 'Schema registrado com sucesso.';
        exit 0;
      "

  # ---------------------------------------------------------------------------
  # Kafka UI — interface web para tópicos, mensagens e schemas
  # Acesse: http://localhost:8080
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: iot-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

# =============================================================================
# Volumes persistentes
# =============================================================================
volumes:
  kafka_data:
